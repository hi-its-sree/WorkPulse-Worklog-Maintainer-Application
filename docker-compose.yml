version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: workpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workpulse
      POSTGRES_PASSWORD: workpulse123
      POSTGRES_DB: workpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_DIALECT: postgres
      DATABASE_URL: postgres://workpulse:workpulse123@postgres:5432/workpulse
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    container_name: workpulse-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - 8080:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
