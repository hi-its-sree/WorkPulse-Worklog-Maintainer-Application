version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: workpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workpulse
      POSTGRES_PASSWORD: workpulse123
      POSTGRES_DB: workpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    environment:
      DB_DIALECT: postgres
      DATABASE_URL: postgres://workpulse:workpulse123@postgres:5432/workpulse
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://backend:8080/api
    ports:
      - 4173:4173
    depends_on:
      - backend

volumes:
  postgres_data:
